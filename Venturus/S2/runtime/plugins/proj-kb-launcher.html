<!-- PROJ-KB-LAUNCHER -->
<!-- Owns the Knowledge Base slot in the prototype ribbon: a link INTO the KB graph page -->
<!-- on every prototype, and the return button OUT of it on the KB page itself. -->
<!-- Owns no panel. Zero markup required in prototypes. -->

<!-- METADATA
Component: Knowledge Base Launcher
Category: Navigation
Complexity: Low

WHAT IT DOES:
- On any prototype: appends <a class="btn btn--small btn--secondary" id="kbBtn">
  "Knowledge Base" to the ribbon's right-hand cell, pointing at `../context/index.html`
- On the Knowledge Base page (detected via `body.kb-page`): appends
  <a id="kbBackBtn"> "Back to prototypes" into the SAME slot instead. The two are never
  both present.

THE RETURN BUTTON:
Its href is the workspace home (`../manage-infrastructure/`), so it works with a middle-click,
an empty history, or a link straight into the KB. The click handler only *prefers*
history.back(), and only when `document.referrer` is same-origin and is not the KB page
itself — a reload or an in-page link is not a "back". Modified clicks are left alone so
open-in-new-tab still works.

WHY A LINK, NOT A PANEL:
The KB is a node graph over ~20 documents with its own search, layouts and reading
drawer — far too much for a ribbon drawer. `proj-requirements-panel` and `proj-qa-panel`
show ONE markdown file each and stay in-page; this one navigates.

RIBBON ORDER:
All ribbon doc buttons inject after an async step, so DOM order is nondeterministic. The
visual order is pinned with flexbox `order` on the (already flex) last cell:

  KB / Back (0) · Q&A (1) · Requirements (2) · Change History (3)

Slots 1-3 live in proj-requirements-panel.css. Slot 0 lives in proj-kb-launcher.css.

PATH ASSUMPTIONS:
`../context/index.html` and `../manage-infrastructure/` assume the KB page is
`prototypes/context/index.html` and the host page is `prototypes/<name>/index.html`. Both
packagers (pack-milan.sh, pack-pages.sh) preserve that layout, so the links survive
sharing. If the KB folder is renamed, update KB_URL in proj-kb-launcher.js — it is the
only place that path appears.

USAGE:
No markup. Auto-injected by plugins.js on `davinci:canvas:ready`.

API:
  ProjKbLauncher.init()   // idempotent; no-op until the ribbon exists
-->
