<!-- PROJ-CASCADER -->
<!-- Multi-column, data-driven drilldown picker. Each column declares its own single/multi select mode. -->

<!-- METADATA
Component: Cascader
Category: Forms
Complexity: High

CRITICAL STRUCTURE REQUIREMENTS:
- MUST be initialized via JavaScript with `ProjCascader.create(target, options)` — markup alone does nothing
- The container element should be empty in HTML; the plugin renders the trigger into it and portals the popup to <body>
- `columns` (array) defines BOTH the number of levels AND each level's selection `mode` ('single' | 'multi')
- `getOptions(level, path)` supplies each column's data on demand — `path` holds the selections of all columns to the left
- A SINGLE-select column closes the popup ONLY when it is the LAST column; otherwise it reveals the next column
- A MULTI-select column NEVER closes the popup on toggle — the popup closes on outside click / Escape
- The `onChange(value, meta)` callback receives the full value object (single → id string|null, multi → id array)

COMMON MISTAKES TO AVOID:
[X] Writing popup/column HTML by hand — the JS API renders everything
[X] Using a global dataset instead of supplying `getOptions`
[X] Expecting a multi-select column to close the popup
[X] Hard-coding colors instead of MDS tokens

JAVASCRIPT INTEGRATION:
- Initialize: `ProjCascader.create('#myEl', { columns, getOptions, value, placeholder, onChange })`
- Reconfigure columns (e.g. mode switch): `ProjCascader.setColumns('#myEl', columns)` — preserves matching-level values
- Set value (fires onChange unless { silent: true }): `ProjCascader.setValue('#myEl', value, { silent: true })`
- Read value: `ProjCascader.getValue('#myEl')` → value object
- Update empty-state placeholder: `ProjCascader.setPlaceholder('#myEl', 'Select a Campus')`
- Re-read options + repaint after data changes: `ProjCascader.refresh('#myEl')`
- Open / Close / Destroy: `ProjCascader.open/close/destroy('#myEl')`

API options:
  columns: Array of { level, mode, placeholder?, allLabel?, countNoun?, showSelectAllControls? }
           - level: stable key used in the value object and getOptions
           - mode:  'single' | 'multi'
           - placeholder: pending-segment text for the trigger
           - allLabel: trigger label when a multi column has everything selected
           - countNoun: noun for the multi count label, e.g. 'Building Controller' → "2 Building Controllers selected"
                        (pluralized with "s" when >1); omit for a bare "N selected"
           - showSelectAllControls: boolean (multi only, default true)
  getOptions: (level, path) => [{ id, label }]   — path = selections of columns to the left
  value: { [level]: idString | null  (single)  ,  [level]: idArray  (multi) }
  placeholder: string — trigger text when nothing is selected
  onChange: (value, meta) => {}   — meta = { level, mode, closed }

COMPANION FILES:
- CSS: proj-cascader.css
- JS:  proj-cascader.js

CORRECT STRUCTURE TEMPLATE:
<div class="proj-cascader" id="myCascader"></div>

<!-- USAGE:
- Designers use this via JS — markup is just the empty container
- Popup is portaled to <body> and positioned with fixed coords (escapes overflow:hidden ancestors)
- Outside-click / Escape closes the popup; it repositions on scroll + resize while open
- Downstream sub-selections are remembered per first-level item: switching to another parent
  and back restores the previously-chosen child selections
- Uses MDS checkbox styling for multi columns and design tokens throughout
-->
