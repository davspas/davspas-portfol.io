<!-- PROJ-ERROR-CASES-PANEL -->
<!-- Displays a prototype's `error-cases.md` — the error, blocked and warning states that -->
<!-- only appear for a specific seeded record or a non-obvious sequence, each with the -->
<!-- flow to reach it — in a docked, resizable panel. Read-only. Zero markup in prototypes. -->

<!-- METADATA
Component: Error Cases Panel
Category: Feedback
Complexity: Low

WHAT IT DOES:
- Probes for `./error-cases.md` next to the prototype's index.html. If it is missing, the
  plugin injects NOTHING — no ribbon button, no panel. Only prototypes that ship the file
  (today: manage-infrastructure) get the button.
- When the file exists: injects an "Error Cases" button into the prototype ribbon's
  right-hand cell (before Q&A / Requirements / Change History) and a docked, resizable
  panel (`.proj-error-cases-drawer`) into <body>
- Renders error-cases.md with `marked` and re-reads it on every open, so edits show up
  without a page reload
- "Copy" copies the raw Markdown source to the clipboard

This is the Q&A panel (proj-qa-panel) one file over: qa.md lists what is undecided,
error-cases.md lists how to reach each hidden error state of the prototype.

AUTHORING error-cases.md:
Plain GitHub-flavored Markdown at `prototypes/<name>/error-cases.md`, rendered as-is.
Convention used by prototypes/manage-infrastructure/error-cases.md:
- `##` section per theme, `###` per case
- the exact message the user sees, then a numbered **Flow** (filters, server, menu path)
- only HIDDEN cases — those that need a specific seeded record or a non-obvious sequence.
  Ordinary inline validation (an empty required field) does not belong here.

CRITICAL STRUCTURE REQUIREMENTS:
- Prototypes add NOTHING but the markdown file. The plugin builds the button and panel.
- Same docked right-edge model as the Requirements and Q&A panels: no overlay, the app
  shifts left via `body.has-proj-error-cases-open { padding-right: var(--proj-error-cases-width) }`
- Only one docked right-edge panel may be open at a time. Opening this one closes
  Requirements and Q&A; clicking their ribbon buttons closes this one.

GOTCHA — SHARED MARKDOWN TYPOGRAPHY:
Rendered content carries BOTH `proj-error-cases-drawer__markdown` and the canvas class
`requirements-drawer__markdown`, which supplies the heading/list/table/code rules.
Depends on `proj-requirements-panel` for that and on `marked` being loaded first.

GOTCHA — file:// :
`fetch` is blocked on file://, so the probe fails and the button never appears when a
prototype is opened straight off disk. Serve over http.

COMMON MISTAKES TO AVOID:
[X] Copying the panel markup into a prototype's index.html
[X] Calling ProjErrorCasesPanel.init() from a prototype — plugins.js wires it
[X] Expecting the button on a prototype with no error-cases.md — that is the gating
[X] Listing ordinary validation here — only hidden cases

JAVASCRIPT INTEGRATION:
- Auto-initialized by `plugins.js` on `davinci:canvas:ready`; `init()` is idempotent.
- Public API: ProjErrorCasesPanel.open() / close() / toggle()
- Keyboard: Escape closes the panel

COMPANION FILES:
- CSS: proj-error-cases-panel.css
- JS:  proj-error-cases-panel.js

REFERENCE STRUCTURE (generated by the plugin — do not hand-author):

<button class="btn btn--small btn--secondary" id="projErrorCasesBtn" title="View hidden error cases">
  <sf-symbol name="exclamationmark.triangle"></sf-symbol>
  <span class="proj-error-cases-ribbon__label">Error Cases</span>
</button>

<aside class="proj-error-cases-drawer" id="projErrorCasesDrawer" aria-hidden="true" aria-label="Error Cases">
  <div class="proj-error-cases-drawer__resizer" id="projErrorCasesResizer"></div>
  <div class="proj-error-cases-drawer__header"> title, Copy button, close button </div>
  <div class="proj-error-cases-drawer__body" id="projErrorCasesContent">
    <div class="proj-error-cases-drawer__markdown requirements-drawer__markdown"><!-- rendered error-cases.md --></div>
  </div>
</aside>

When to prompt: Never — global, self-installing, self-gating.
Variants: none
States: absent (no error-cases.md), closed (default), open (`body.has-proj-error-cases-open`),
        resizing (`body.is-resizing-proj-error-cases`)
-->
